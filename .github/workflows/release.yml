# Unsigned evaluation pipeline — triggered by immutable v* tags only.
# Every package is explicitly marked unsigned and must never be represented as a
# signed, notarized, production-ready, or enterprise release.

name: release

on:
  push:
    tags:
      # SemVer and prerelease tags: v0.1.0, v0.1.0-rc.1
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Build unsigned macOS arm64 evaluation package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install ".[dev,desktop]"
          pytest -q
          python scripts/build_pyinstaller.py --os macos --arch arm64 --unsigned-evaluation
          test -f packaging/dist/CloudDataSanitizer-macos-arm64.trust.json
          python - <<'PY'
          import json
          trust=json.load(open("packaging/dist/CloudDataSanitizer-macos-arm64.trust.json"))
          assert trust["signature_status"]=="unsigned_evaluation", trust
          assert trust["notarization_status"]=="not_attempted", trust
          PY
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: CloudDataSanitizer-macos-arm64
          path: |
            packaging/dist/CloudDataSanitizer-macos-arm64.zip
            packaging/dist/CloudDataSanitizer-macos-arm64.zip.sha256
            packaging/dist/CloudDataSanitizer-macos-arm64.trust.json
          if-no-files-found: error

  build-macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Build unsigned macOS x64 evaluation package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install ".[dev,desktop]"
          pytest -q
          python scripts/build_pyinstaller.py --os macos --arch x64 --unsigned-evaluation
          test -f packaging/dist/CloudDataSanitizer-macos-x64.trust.json
          python - <<'PY'
          import json
          trust=json.load(open("packaging/dist/CloudDataSanitizer-macos-x64.trust.json"))
          assert trust["signature_status"]=="unsigned_evaluation", trust
          assert trust["notarization_status"]=="not_attempted", trust
          PY
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: CloudDataSanitizer-macos-x64
          path: |
            packaging/dist/CloudDataSanitizer-macos-x64.zip
            packaging/dist/CloudDataSanitizer-macos-x64.zip.sha256
            packaging/dist/CloudDataSanitizer-macos-x64.trust.json
          if-no-files-found: error

  build-windows-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Build unsigned Windows x64 evaluation package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install ".[dev,desktop]"
          pytest -q
          python scripts/build_pyinstaller.py --os windows --arch x64 --unsigned-evaluation
          test -f packaging/dist/CloudDataSanitizer-windows-x64.trust.json
          python - <<'PY'
          import json
          trust=json.load(open("packaging/dist/CloudDataSanitizer-windows-x64.trust.json"))
          assert trust["signature_status"]=="unsigned_evaluation", trust
          assert trust["notarization_status"]=="n/a", trust
          PY
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: CloudDataSanitizer-windows-x64
          path: |
            packaging/dist/CloudDataSanitizer-windows-x64.zip
            packaging/dist/CloudDataSanitizer-windows-x64.zip.sha256
            packaging/dist/CloudDataSanitizer-windows-x64.trust.json
          if-no-files-found: error

  aggregate:
    runs-on: ubuntu-latest
    needs: [build-macos-arm64, build-macos-x64, build-windows-x64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          path: release-artifacts
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Fail closed if release set incomplete
        run: |
          set -euo pipefail
          for name in \
            CloudDataSanitizer-macos-arm64.zip \
            CloudDataSanitizer-macos-x64.zip \
            CloudDataSanitizer-windows-x64.zip
          do
            test -n "$(find release-artifacts -name "$name" | head -1)"
          done
      - name: Assemble checksums, manifest, SBOM, provenance
        run: |
          python scripts/assemble_release.py \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --release-kind evaluation \
            --input-dir release-artifacts \
            --output-dir release-artifacts/final
          python - <<'PY'
          import json
          from pathlib import Path
          final = Path("release-artifacts/final")
          m = json.load(open(final / "release-manifest.json"))
          assert m["source_tag"].startswith("v")
          assert len(m["source_commit"]) == 40
          assert len(m["artifacts"]) == 3
          assert m["release_kind"] == "evaluation"
          assert m["production_ready"] is False
          for art in m["artifacts"]:
              assert art["signature_status"] == "unsigned_evaluation", art
              assert art["size_bytes"] > 0
              assert art["sha256"]
          for required in (
              "SHA256SUMS.txt",
              "release-manifest.json",
              "SBOM.json",
              "sbom.cdx.json",
              "provenance.json",
          ):
              assert (final / required).is_file(), required
          PY
      - name: Create unsigned evaluation draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "FAIL CLOSED: missing release notes file $NOTES_FILE"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/final/CloudDataSanitizer-macos-arm64.zip \
            release-artifacts/final/CloudDataSanitizer-macos-arm64.zip.sha256 \
            release-artifacts/final/CloudDataSanitizer-macos-x64.zip \
            release-artifacts/final/CloudDataSanitizer-macos-x64.zip.sha256 \
            release-artifacts/final/CloudDataSanitizer-windows-x64.zip \
            release-artifacts/final/CloudDataSanitizer-windows-x64.zip.sha256 \
            release-artifacts/final/SHA256SUMS.txt \
            release-artifacts/final/release-manifest.json \
            release-artifacts/final/SBOM.json \
            release-artifacts/final/sbom.cdx.json \
            release-artifacts/final/provenance.json \
            --title "v${GITHUB_REF_NAME#v}: MOTOC Cloud Data Sanitizer — Unsigned Evaluation" \
            --notes-file "$NOTES_FILE" \
            --verify-tag \
            --prerelease \
            --draft
